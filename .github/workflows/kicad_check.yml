name: KiCad CI

on:
  push:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/*.kicad_dru'
      - '**/*.kicad_mod'
      - '**/*.kicad_sym'

  pull_request:

jobs:
  kicad:
    name: KiCad 10 ERC / DRC
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Checkout
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # Install KiCad 10
      # ============================================

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt update
          sudo apt install --install-recommends kicad

      - name: Show KiCad version
        run: |
          kicad-cli version
          kicad-cli version --format about


      # ============================================
      # Install Arduino KiCad Library
      # ============================================

      - name: Install Arduino KiCad Library
        run: |
          git clone --depth 1 \
            https://github.com/Alarm-Siren/arduino-kicad-library.git \
            "$HOME/arduino-kicad-library"

          test -f \
            "$HOME/arduino-kicad-library/symbols/arduino-library.kicad_sym"

          test -d \
            "$HOME/arduino-kicad-library/footprints/arduino-library.pretty"


      # ============================================
      # Configure KiCad libraries
      # ============================================
      #
      # Wir kopieren die von KiCad mitgelieferten
      # Standardtabellen und ERWEITERN sie um Arduino.
      #
      # Die Standard-Libraries bleiben dadurch erhalten.
      #

      - name: Configure KiCad libraries
        shell: bash
        run: |
          set -e

          KICAD_CONFIG="$HOME/.config/kicad/10.0"
          TEMPLATE="/usr/share/kicad/template"

          mkdir -p "$KICAD_CONFIG"

          echo "=== KiCad template directory ==="
          ls -la "$TEMPLATE"

          echo
          echo "=== Installed KiCad symbols ==="
          find /usr/share/kicad -maxdepth 3 \
            -name 'Device.kicad_sym' \
            -o -name 'Switch.kicad_sym' \
            -o -name 'MCU_Module.kicad_sym'

          echo
          echo "=== Installed KiCad footprints ==="
          find /usr/share/kicad -maxdepth 3 \
            -type d \
            \( -name 'LED_THT.pretty' \
            -o -name 'Resistor_THT.pretty' \
            -o -name 'Module.pretty' \
            -o -name 'Button_Switch_THT.pretty' \)


          # ------------------------------------------------
          # Die mit KiCad gelieferten Tabellen suchen
          # ------------------------------------------------

          GLOBAL_SYM_TABLE="$TEMPLATE/sym-lib-table"
          GLOBAL_FP_TABLE="$TEMPLATE/fp-lib-table"

          if [ ! -f "$GLOBAL_SYM_TABLE" ]; then
            echo "ERROR: KiCad sym-lib-table not found:"
            echo "$GLOBAL_SYM_TABLE"
            exit 1
          fi

          if [ ! -f "$GLOBAL_FP_TABLE" ]; then
            echo "ERROR: KiCad fp-lib-table not found:"
            echo "$GLOBAL_FP_TABLE"
            exit 1
          fi


          # ------------------------------------------------
          # Standardtabellen übernehmen
          # ------------------------------------------------

          cp "$GLOBAL_SYM_TABLE" \
            "$KICAD_CONFIG/sym-lib-table"

          cp "$GLOBAL_FP_TABLE" \
            "$KICAD_CONFIG/fp-lib-table"


          # ------------------------------------------------
          # Arduino Symbol Library hinzufügen
          # ------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          config = Path.home() / ".config/kicad/10.0"
          table = config / "sym-lib-table"

          text = table.read_text()

          entry = '''    (lib
              (name "PCM_arduino-library")
              (type "KiCad")
              (uri "__ARDUINO_SYMBOLS__")
              (options "")
              (descr "Arduino KiCad Library")
            )
          '''

          if "PCM_arduino-library" not in text:
              text = text.replace(
                  "(sym_lib_table\n",
                  "(sym_lib_table\n" + entry,
                  1
              )

          text = text.replace(
              "__ARDUINO_SYMBOLS__",
              str(
                  Path.home()
                  / "arduino-kicad-library/symbols/arduino-library.kicad_sym"
              )
          )

          table.write_text(text)
          PY


          # ------------------------------------------------
          # Arduino Footprint Library hinzufügen
          # ------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          config = Path.home() / ".config/kicad/10.0"
          table = config / "fp-lib-table"

          text = table.read_text()

          entry = '''    (lib
              (name "PCM_arduino-library")
              (type "KiCad")
              (uri "__ARDUINO_FOOTPRINTS__")
              (options "")
              (descr "Arduino KiCad Library")
            )
          '''

          if "PCM_arduino-library" not in text:
              text = text.replace(
                  "(fp_lib_table\n",
                  "(fp_lib_table\n" + entry,
                  1
              )

          text = text.replace(
              "__ARDUINO_FOOTPRINTS__",
              str(
                  Path.home()
                  / "arduino-kicad-library/footprints/arduino-library.pretty"
              )
          )

          table.write_text(text)
          PY


          echo
          echo "========================================"
          echo "Final symbol library table"
          echo "========================================"
          cat "$KICAD_CONFIG/sym-lib-table"

          echo
          echo "========================================"
          echo "Final footprint library table"
          echo "========================================"
          cat "$KICAD_CONFIG/fp-lib-table"


      # ============================================
      # ERC
      # ============================================

      - name: Run ERC
        shell: bash
        run: |
          set +e

          failed=0

          mkdir -p reports/erc

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_sch' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad schematics found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "ERC: $file"
            echo "========================================"

            name="$(basename "$file" .kicad_sch)"
            report="reports/erc/${name}-erc.rpt"

            kicad-cli sch erc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              echo "ERC FAILED: $file"
              failed=1
            else
              echo "ERC PASSED: $file"
            fi
          done

          exit $failed


      # ============================================
      # DRC
      # ============================================

      - name: Run DRC
        shell: bash
        run: |
          set +e

          failed=0

          mkdir -p reports/drc

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_pcb' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad PCBs found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "DRC: $file"
            echo "========================================"

            name="$(basename "$file" .kicad_pcb)"
            report="reports/drc/${name}-drc.rpt"

            kicad-cli pcb drc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              echo "DRC FAILED: $file"
              failed=1
            else
              echo "DRC PASSED: $file"
            fi
          done

          exit $failed


      # ============================================
      # Reports immer hochladen
      # ============================================

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: reports/
          if-no-files-found: ignore
