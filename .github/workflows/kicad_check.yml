name: KiCad CI

on:
  push:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/*.kicad_dru'
      - '**/*.kicad_mod'
      - '**/*.kicad_sym'

  pull_request:

jobs:
  kicad:
    name: KiCad 10 ERC / DRC
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # KiCad 10
      # ==========================================

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt update
          sudo apt install --install-recommends kicad

      - name: Check KiCad
        run: |
          kicad-cli version


      # ==========================================
      # Arduino KiCad Library
      # ==========================================

      - name: Install Arduino KiCad Library
        run: |
          git clone --depth 1 \
            https://github.com/Alarm-Siren/arduino-kicad-library.git \
            "$HOME/arduino-kicad-library"


      # ==========================================
      # Configure Arduino libraries
      # ==========================================
      #
      # WICHTIG:
      # Die Arduino-Library wird in der
      # projektbezogenen Tabelle eingetragen.
      #
      # Die KiCad Standard-Libraries werden NICHT
      # überschrieben.
      #

      - name: Configure Arduino libraries
        shell: bash
        run: |
          PROJECT_DIR="./Wuerfel_Schaltplan"

          test -f "$PROJECT_DIR/Wuerfel_Schaltplan.kicad_pro"

          cat > "$PROJECT_DIR/sym-lib-table" <<EOF
          (sym_lib_table
            (version 7)
            (lib
              (name "PCM_arduino-library")
              (type "KiCad")
              (uri "$HOME/arduino-kicad-library/symbols/arduino-library.kicad_sym")
              (options "")
              (descr "Arduino KiCad Library")
            )
          )
          EOF

          cat > "$PROJECT_DIR/fp-lib-table" <<EOF
          (fp_lib_table
            (version 7)
            (lib
              (name "PCM_arduino-library")
              (type "KiCad")
              (uri "$HOME/arduino-kicad-library/footprints/arduino-library.pretty")
              (options "")
              (descr "Arduino KiCad Library")
            )
          )
          EOF

          echo "=== Symbol library table ==="
          cat "$PROJECT_DIR/sym-lib-table"

          echo
          echo "=== Footprint library table ==="
          cat "$PROJECT_DIR/fp-lib-table"


      # ==========================================
      # Check that KiCad's standard libraries
      # actually exist
      # ==========================================

      - name: Check KiCad standard libraries
        shell: bash
        run: |
          echo "Searching for KiCad libraries..."

          echo
          echo "Device:"
          find /usr -name 'Device.kicad_sym' 2>/dev/null | head

          echo
          echo "Switch:"
          find /usr -name 'Switch.kicad_sym' 2>/dev/null | head

          echo
          echo "MCU_Module:"
          find /usr -name 'MCU_Module.kicad_sym' 2>/dev/null | head

          echo
          echo "LED_THT:"
          find /usr -type d -name 'LED_THT.pretty' 2>/dev/null | head

          echo
          echo "Resistor_THT:"
          find /usr -type d -name 'Resistor_THT.pretty' 2>/dev/null | head

          echo
          echo "Module:"
          find /usr -type d -name 'Module.pretty' 2>/dev/null | head

          echo
          echo "Button_Switch_THT:"
          find /usr -type d -name 'Button_Switch_THT.pretty' 2>/dev/null | head


      # ==========================================
      # ERC
      # ==========================================

      - name: Run ERC
        shell: bash
        run: |
          set +e

          failed=0

          mkdir -p reports/erc

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_sch' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad schematics found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "ERC: $file"
            echo "========================================"

            name="$(basename "$file" .kicad_sch)"
            report="reports/erc/${name}-erc.rpt"

            kicad-cli sch erc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              echo "ERC FAILED: $file"
              failed=1
            else
              echo "ERC PASSED: $file"
            fi
          done

          exit $failed


      # ==========================================
      # DRC
      # ==========================================

      - name: Run DRC
        shell: bash
        run: |
          set +e

          failed=0

          mkdir -p reports/drc

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_pcb' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad PCBs found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "DRC: $file"
            echo "========================================"

            name="$(basename "$file" .kicad_pcb)"
            report="reports/drc/${name}-drc.rpt"

            kicad-cli pcb drc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              echo "DRC FAILED: $file"
              failed=1
            else
              echo "DRC PASSED: $file"
            fi
          done

          exit $failed


      # ==========================================
      # Reports
      # ==========================================

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: reports/
          if-no-files-found: ignore
