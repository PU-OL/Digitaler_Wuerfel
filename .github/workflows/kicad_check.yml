name: KiCad Check

on:
  push:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/*.kicad_dru'
      - '**/*.kicad_mod'
      - '**/*.kicad_sym'

  pull_request:

jobs:
  kicad-check:
    name: KiCad 10 ERC / DRC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # KiCad 10
      # ----------------------------------------

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt update
          sudo apt install --install-recommends kicad

      - name: Show KiCad version
        run: |
          kicad-cli version

      # ----------------------------------------
      # Arduino KiCad Library
      # ----------------------------------------

      - name: Install Arduino KiCad Library
        run: |
          git clone --depth 1 \
            https://github.com/Alarm-Siren/arduino-kicad-library.git \
            "$HOME/arduino-kicad-library"

      - name: Configure KiCad libraries
        shell: bash
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"

          # --------------------------------------------
          # Symbol libraries
          # --------------------------------------------

          {
            echo '(sym_lib_table'
            echo '  (version 7)'

            find /usr/share/kicad/symbols \
              -maxdepth 1 \
              -type f \
              -name '*.kicad_sym' \
              -printf '%f\n' |
            sort |
            while read -r file; do
              name="${file%.kicad_sym}"

              echo "  (lib"
              echo "    (name \"$name\")"
              echo "    (type \"KiCad\")"
              echo "    (uri \"/usr/share/kicad/symbols/$file\")"
              echo '    (options "")'
              echo '    (descr "")'
              echo '  )'
            done

            # Arduino symbols
            echo '  (lib'
            echo '    (name "arduino-library")'
            echo '    (type "KiCad")'
            echo "    (uri \"$HOME/arduino-kicad-library/symbols/arduino-library.kicad_sym\")"
            echo '    (options "")'
            echo '    (descr "Arduino KiCad Library")'
            echo '  )'

            echo ')'
          } > "$HOME/.config/kicad/10.0/sym-lib-table"


          # --------------------------------------------
          # Footprint libraries
          # --------------------------------------------

          {
            echo '(fp_lib_table'
            echo '  (version 7)'

            find /usr/share/kicad/footprints \
              -maxdepth 1 \
              -type d \
              -name '*.pretty' \
              -printf '%f\n' |
            sort |
            while read -r dir; do
              name="${dir%.pretty}"

              echo "  (lib"
              echo "    (name \"$name\")"
              echo "    (type \"KiCad\")"
              echo "    (uri \"/usr/share/kicad/footprints/$dir\")"
              echo '    (options "")'
              echo '    (descr "")'
              echo '  )'
            done

            # Arduino footprints
            echo '  (lib'
            echo '    (name "arduino-library")'
            echo '    (type "KiCad")'
            echo "    (uri \"$HOME/arduino-kicad-library/footprints/arduino-library.pretty\")"
            echo '    (options "")'
            echo '    (descr "Arduino KiCad Library")'
            echo '  )'

            echo ')'
          } > "$HOME/.config/kicad/10.0/fp-lib-table"


          # --------------------------------------------
          # Debug: show relevant libraries
          # --------------------------------------------

          echo "=== Symbol libraries ==="
          grep -E 'name "(Device|Switch|MCU_Module|arduino-library)"' \
            "$HOME/.config/kicad/10.0/sym-lib-table" || true

          echo "=== Footprint libraries ==="
          grep -E 'name "(LED_THT|Resistor_THT|Module|Button_Switch_THT|arduino-library)"' \
            "$HOME/.config/kicad/10.0/fp-lib-table" || true

      # ----------------------------------------
      # Register Arduino footprint library
      # ----------------------------------------

      - name: Configure Arduino footprint library
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"

          cat > "$HOME/.config/kicad/10.0/fp-lib-table" <<EOF
          (fp_lib_table
            (version 7)
            (lib
              (name "arduino-library")
              (type "KiCad")
              (uri "$HOME/arduino-kicad-library/footprints/arduino-library.pretty")
              (options "")
              (descr "Arduino KiCad Library")
            )
          )
          EOF

      # ----------------------------------------
      # ERC
      # ----------------------------------------

      - name: Run ERC
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . -type f -name '*.kicad_sch' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad schematics found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "ERC: $file"
            echo "========================================"

            kicad-cli sch erc \
              --exit-code-violations \
              "$file"
          done

      # ----------------------------------------
      # DRC
      # ----------------------------------------

      - name: Run DRC
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . -type f -name '*.kicad_pcb' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad PCBs found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "DRC: $file"
            echo "========================================"

            kicad-cli pcb drc \
              --exit-code-violations \
              "$file"
          done
