name: KiCad Check

on:
  push:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/*.kicad_dru'
      - '**/*.kicad_mod'
      - '**/*.kicad_sym'

  pull_request:

jobs:
  kicad-check:
    name: KiCad 10 ERC / DRC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt update
          sudo apt install --install-recommends \
            kicad \
            kicad-libraries

      - name: Show KiCad version
        run: |
          kicad-cli version

      # --------------------------------------------------
      # Arduino KiCad Library
      # --------------------------------------------------

      - name: Install Arduino KiCad Library
        run: |
          git clone --depth 1 \
            https://github.com/Alarm-Siren/arduino-kicad-library.git \
            "$HOME/arduino-kicad-library"

      - name: Configure KiCad libraries
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"

          cat > "$HOME/.config/kicad/10.0/sym-lib-table" <<EOF
          (sym_lib_table
            (version 7)
            (lib
              (name "arduino-library")
              (type "KiCad")
              (uri "$HOME/arduino-kicad-library/symbols/arduino-library.kicad_sym")
              (options "")
              (descr "Arduino KiCad Library")
            )
          )
          EOF

          cat > "$HOME/.config/kicad/10.0/fp-lib-table" <<EOF
          (fp_lib_table
            (version 7)
            (lib
              (name "arduino-library")
              (type "KiCad")
              (uri "$HOME/arduino-kicad-library/footprints/arduino-library.pretty")
              (options "")
              (descr "Arduino KiCad Library")
            )
          )
          EOF

      # --------------------------------------------------
      # ERC
      # --------------------------------------------------

      - name: Run ERC
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . -type f -name '*.kicad_sch' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad schematics found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "ERC: $file"
            echo "========================================"

            kicad-cli sch erc \
              --exit-code-violations \
              "$file"
          done

      - name: Upload ERC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-erc-reports
          path: '**/*-erc.rpt'
          if-no-files-found: ignore

      # --------------------------------------------------
      # DRC
      # --------------------------------------------------

      - name: Run DRC
        shell: bash
        run: |
          mapfile -d '' files < <(
            find . -type f -name '*.kicad_pcb' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad PCBs found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "DRC: $file"
            echo "========================================"

            kicad-cli pcb drc \
              --exit-code-violations \
              "$file"
          done
