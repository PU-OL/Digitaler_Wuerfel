name: KiCad CI

on:
  push:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/*.kicad_dru'
      - '**/*.kicad_mod'
      - '**/*.kicad_sym'

  pull_request:

jobs:
  kicad:
    name: KiCad 10 ERC / DRC
    runs-on: ubuntu-latest

    steps:
      # ============================================
      # Checkout
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # Install KiCad 10
      # ============================================

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt update
          sudo apt install --install-recommends kicad

      - name: Show KiCad version
        run: |
          kicad-cli version
          kicad-cli version --format about


      # ============================================
      # Install Arduino KiCad Library
      # ============================================

      - name: Install Arduino KiCad Library
        run: |
          git clone --depth 1 \
            https://github.com/Alarm-Siren/arduino-kicad-library.git \
            "$HOME/arduino-kicad-library"

          test -f \
            "$HOME/arduino-kicad-library/symbols/arduino-library.kicad_sym"

          test -d \
            "$HOME/arduino-kicad-library/footprints/arduino-library.pretty"


      # ============================================
      # Configure KiCad libraries
      # ============================================

      - name: Configure KiCad libraries
        shell: bash
        run: |
          set -e

          KICAD_CONFIG="$HOME/.config/kicad/10.0"
          TEMPLATE="/usr/share/kicad/template"

          mkdir -p "$KICAD_CONFIG"

          echo "=== KiCad template directory ==="
          ls -la "$TEMPLATE" || echo "Template directory not found"

          echo
          echo "=== Installed KiCad symbols ==="
          find /usr/share/kicad -maxdepth 3 \
            -name 'Device.kicad_sym' \
            -o -name 'Switch.kicad_sym' \
            -o -name 'MCU_Module.kicad_sym' || echo "Some symbols not found"

          echo
          echo "=== Installed KiCad footprints ==="
          find /usr/share/kicad -maxdepth 3 \
            -type d \
            \( -name 'LED_THT.pretty' \
            -o -name 'Resistor_THT.pretty' \
            -o -name 'Module.pretty' \
            -o -name 'Button_Switch_THT.pretty' \) || echo "Some footprints not found"

          # ------------------------------------------------
          # Create default library tables if they don't exist
          # ------------------------------------------------

          # Create symbol library table
          python3 <<'PY_SYM'
          from pathlib import Path

          config_dir = Path.home() / ".config/kicad/10.0"
          config_dir.mkdir(parents=True, exist_ok=True)
          
          sym_table = config_dir / "sym-lib-table"
          
          default_sym_table = '''(sym_lib_table
            (version 7)
            (lib (name "Device") (type "KiCad") (uri "${KIPRJMOD}/../../../usr/share/kicad/symbols/Device.kicad_sym") (options "") (descr "Device symbols"))
            (lib (name "Switch") (type "KiCad") (uri "${KIPRJMOD}/../../../usr/share/kicad/symbols/Switch.kicad_sym") (options "") (descr "Switch symbols"))
            (lib (name "MCU_Module") (type "KiCad") (uri "${KIPRJMOD}/../../../usr/share/kicad/symbols/MCU_Module.kicad_sym") (options "") (descr "MCU Module symbols"))
            (lib (name "PCM_arduino-library") (type "KiCad") (uri "__ARDUINO_SYMBOLS__") (options "") (descr "Arduino KiCad Library"))
          )
          '''
          
          if not sym_table.exists():
              text = default_sym_table
          else:
              text = sym_table.read_text()
          
          # Add Arduino library if not present
          if "PCM_arduino-library" not in text:
              text = text.replace(
                  "(sym_lib_table",
                  "(sym_lib_table",
                  1
              )
              # Insert before closing paren
              text = text.rstrip()[:-1]  # Remove last )
              text += '''
            (lib (name "PCM_arduino-library") (type "KiCad") (uri "__ARDUINO_SYMBOLS__") (options "") (descr "Arduino KiCad Library"))
          )
          '''
          
          # Replace placeholder
          text = text.replace(
              "__ARDUINO_SYMBOLS__",
              str(Path.home() / "arduino-kicad-library/symbols/arduino-library.kicad_sym")
          )
          
          sym_table.write_text(text)
          print(f"Created/Updated symbol library table: {sym_table}")
          PY_SYM

          # Create footprint library table
          python3 <<'PY_FP'
          from pathlib import Path

          config_dir = Path.home() / ".config/kicad/10.0"
          config_dir.mkdir(parents=True, exist_ok=True)
          
          fp_table = config_dir / "fp-lib-table"
          
          default_fp_table = '''(fp_lib_table
            (version 7)
            (lib (name "LED_THT") (type "KiCad") (uri "${KIPRJMOD}/../../../usr/share/kicad/footprints/LED_THT.pretty") (options "") (descr "LED through-hole footprints"))
            (lib (name "Resistor_THT") (type "KiCad") (uri "${KIPRJMOD}/../../../usr/share/kicad/footprints/Resistor_THT.pretty") (options "") (descr "Resistor through-hole footprints"))
            (lib (name "Module") (type "KiCad") (uri "${KIPRJMOD}/../../../usr/share/kicad/footprints/Module.pretty") (options "") (descr "Module footprints"))
            (lib (name "Button_Switch_THT") (type "KiCad") (uri "${KIPRJMOD}/../../../usr/share/kicad/footprints/Button_Switch_THT.pretty") (options "") (descr "Button/Switch through-hole footprints"))
            (lib (name "PCM_arduino-library") (type "KiCad") (uri "__ARDUINO_FOOTPRINTS__") (options "") (descr "Arduino KiCad Library"))
          )
          '''
          
          if not fp_table.exists():
              text = default_fp_table
          else:
              text = fp_table.read_text()
          
          # Add Arduino library if not present
          if "PCM_arduino-library" not in text:
              text = text.rstrip()[:-1]  # Remove last )
              text += '''
            (lib (name "PCM_arduino-library") (type "KiCad") (uri "__ARDUINO_FOOTPRINTS__") (options "") (descr "Arduino KiCad Library"))
          )
          '''
          
          # Replace placeholder
          text = text.replace(
              "__ARDUINO_FOOTPRINTS__",
              str(Path.home() / "arduino-kicad-library/footprints/arduino-library.pretty")
          )
          
          fp_table.write_text(text)
          print(f"Created/Updated footprint library table: {fp_table}")
          PY_FP

          echo
          echo "========================================"
          echo "Final symbol library table"
          echo "========================================"
          cat "$KICAD_CONFIG/sym-lib-table"

          echo
          echo "========================================"
          echo "Final footprint library table"
          echo "========================================"
          cat "$KICAD_CONFIG/fp-lib-table"


      # ============================================
      # ERC
      # ============================================

      - name: Run ERC
        shell: bash
        run: |
          set +e

          failed=0

          mkdir -p reports/erc

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_sch' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad schematics found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "ERC: $file"
            echo "========================================"

            name="$(basename "$file" .kicad_sch)"
            report="reports/erc/${name}-erc.rpt"

            kicad-cli sch erc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              echo "ERC FAILED: $file"
              echo "Report content:"
              cat "$report" || true
              failed=1
            else
              echo "ERC PASSED: $file"
            fi
          done

          exit $failed


      # ============================================
      # DRC
      # ============================================

      - name: Run DRC
        shell: bash
        run: |
          set +e

          failed=0

          mkdir -p reports/drc

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_pcb' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad PCBs found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "========================================"
            echo "DRC: $file"
            echo "========================================"

            name="$(basename "$file" .kicad_pcb)"
            report="reports/drc/${name}-drc.rpt"

            kicad-cli pcb drc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              echo "DRC FAILED: $file"
              echo "Report content:"
              cat "$report" || true
              failed=1
            else
              echo "DRC PASSED: $file"
            fi
          done

          exit $failed


      # ============================================
      # Reports immer hochladen
      # ============================================

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: reports/
          if-no-files-found: ignore
