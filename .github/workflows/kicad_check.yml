name: KiCad CI

on:
  # Bei einem Push nur starten, wenn eine KiCad-Datei geändert wurde
  push:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/*.kicad_dru'
      - '**/*.kicad_mod'
      - '**/*.kicad_sym'

  # Bei jedem Pull Request starten
  pull_request:

jobs:
  kicad:
    name: KiCad 10 ERC / DRC
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # KiCad 10
      # --------------------------------------------------

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt update
          sudo apt install --install-recommends kicad

      - name: Check KiCad
        run: |
          kicad-cli version

          echo "KICAD10_SYMBOL_DIR=$KICAD10_SYMBOL_DIR"
          echo "KICAD10_FOOTPRINT_DIR=$KICAD10_FOOTPRINT_DIR"
          echo "KICAD10_3RD_PARTY=$KICAD10_3RD_PARTY"

      # --------------------------------------------------
      # Arduino KiCad Library
      # --------------------------------------------------

      - name: Install Arduino KiCad Library
        run: |
          git clone --depth 1 \
            https://github.com/Alarm-Siren/arduino-kicad-library.git \
            "$HOME/arduino-kicad-library"

      # --------------------------------------------------
      # Arduino Library Tables
      #
      # WICHTIG:
      # Wir erstellen KEINE globale Tabelle.
      # Nur eine projektbezogene Tabelle für Arduino.
      # Die normalen KiCad Libraries bleiben erhalten.
      # --------------------------------------------------

      - name: Configure Arduino libraries
        shell: bash
        run: |
          PROJECT_DIR="./Wuerfel_Schaltplan"

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/Wuerfel_Schaltplan.kicad_pro"

          # Arduino Symbol Library
          cat > "$PROJECT_DIR/sym-lib-table" <<EOF
          (sym_lib_table
            (version 7)
            (lib
              (name "PCM_arduino-library")
              (type "KiCad")
              (uri "$HOME/arduino-kicad-library/symbols/arduino-library.kicad_sym")
              (options "")
              (descr "Arduino KiCad Library")
            )
          )
          EOF

          # Arduino Footprint Library
          cat > "$PROJECT_DIR/fp-lib-table" <<EOF
          (fp_lib_table
            (version 7)
            (lib
              (name "PCM_arduino-library")
              (type "KiCad")
              (uri "$HOME/arduino-kicad-library/footprints/arduino-library.pretty")
              (options "")
              (descr "Arduino KiCad Library")
            )
          )
          EOF

          echo "=== Symbol table ==="
          cat "$PROJECT_DIR/sym-lib-table"

          echo
          echo "=== Footprint table ==="
          cat "$PROJECT_DIR/fp-lib-table"

      # --------------------------------------------------
      # Verify standard KiCad libraries
      # --------------------------------------------------

      - name: Verify KiCad standard libraries
        shell: bash
        run: |
          echo "Checking standard symbol libraries..."

          test -f "$KICAD10_SYMBOL_DIR/Device.kicad_sym"
          test -f "$KICAD10_SYMBOL_DIR/Switch.kicad_sym"
          test -f "$KICAD10_SYMBOL_DIR/MCU_Module.kicad_sym"

          echo "Checking standard footprint libraries..."

          test -d "$KICAD10_FOOTPRINT_DIR/LED_THT.pretty"
          test -d "$KICAD10_FOOTPRINT_DIR/Resistor_THT.pretty"
          test -d "$KICAD10_FOOTPRINT_DIR/Module.pretty"
          test -d "$KICAD10_FOOTPRINT_DIR/Button_Switch_THT.pretty"

          echo "Checking Arduino libraries..."

          test -f "$HOME/arduino-kicad-library/symbols/arduino-library.kicad_sym"
          test -d "$HOME/arduino-kicad-library/footprints/arduino-library.pretty"

          echo "All required libraries found."

      # --------------------------------------------------
      # ERC
      # --------------------------------------------------

      - name: Run ERC
        shell: bash
        run: |
          set +e

          failed=0

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_sch' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad schematics found."
            exit 0
          fi

          mkdir -p reports/erc

          for file in "${files[@]}"; do
            echo "========================================"
            echo "ERC: $file"
            echo "========================================"

            filename="$(basename "$file" .kicad_sch)"
            report="reports/erc/${filename}-erc.rpt"

            kicad-cli sch erc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              failed=1
              echo "ERC failed for: $file"
            else
              echo "ERC passed for: $file"
            fi
          done

          exit $failed

      # --------------------------------------------------
      # DRC
      # --------------------------------------------------

      - name: Run DRC
        shell: bash
        run: |
          set +e

          failed=0

          mapfile -d '' files < <(
            find . -type f -name '*.kicad_pcb' -print0
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No KiCad PCBs found."
            exit 0
          fi

          mkdir -p reports/drc

          for file in "${files[@]}"; do
            echo "========================================"
            echo "DRC: $file"
            echo "========================================"

            filename="$(basename "$file" .kicad_pcb)"
            report="reports/drc/${filename}-drc.rpt"

            kicad-cli pcb drc \
              --output "$report" \
              --exit-code-violations \
              "$file"

            result=$?

            if [ $result -ne 0 ]; then
              failed=1
              echo "DRC failed for: $file"
            else
              echo "DRC passed for: $file"
            fi
          done

          exit $failed

      # --------------------------------------------------
      # Reports hochladen, auch wenn ERC/DRC fehlschlägt
      # --------------------------------------------------

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reports
          path: reports/
          if-no-files-found: ignore
